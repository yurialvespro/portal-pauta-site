[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# O index.html nunca fica em cache: assim o navegador sempre pega a versão mais
# recente do site logo ao abrir. Sem isso, o time continuaria vendo uma versão
# antiga presa no cache mesmo depois de um deploy novo (foi exatamente o que
# aconteceu aqui — só funcionava em aba anônima).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Os arquivos em /assets/ têm nome com hash único a cada build (ex: index-a1b2c3.js),
# então podem ser cacheados para sempre com segurança: quando o conteúdo muda, o
# nome muda junto e o navegador busca o novo automaticamente.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
